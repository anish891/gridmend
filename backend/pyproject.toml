[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "falkordb",
    "networkx",
    "openai",
    "pandapower",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gridmend = "gridmend.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["gridmend*", "eval*"]
