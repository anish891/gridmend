[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "falkordb",
    "python-dotenv",
]

[project.scripts]
gridmend = "gridmend.cli:main"

[tool.setuptools.packages.find]
include = ["gridmend*"]
