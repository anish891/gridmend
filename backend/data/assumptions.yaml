# Synthetic operating assumptions layered on the IEEE 33-bus feeder.
# Bus numbers and line ids use IEEE numbering (1-33), lines as "low-high".

substation: 1
breaker: "1-2"

sectionalizers:
  - "2-3"
  - "6-7"
  - "9-10"
  - "13-14"
  - "2-19"
  - "3-23"
  - "6-26"
  - "29-30"

# Ties are taken from the case data: the lines it stores out of service.

critical_loads:
  7: hospital
  15: fire station
  24: water pumping
  30: telecom

# Named sites that are ordinary load on a normal day. The restoration policy
# (data/policy.md) can raise them for an incident, e.g. a cooling centre in a heatwave.
facilities:
  11: cooling centre

weights:
  critical: 10
  default: 1

# Trunk = consecutive buses on the main feeder 1-18. Everything else
# (laterals and ties) gets the lateral rating.
main_feeder_end: 18

# Tuned against summed load kVA:
# - base case: 6-26 carries Z26+Z30 = 1322 kVA, 2-3 carries 3863 kVA
# - fault in Z3: 2-19 can carry Z19+Z7 (904) but not Z19+Z7+Z10+Z14 (1584)
ratings_kva:
  trunk: 5000
  lateral: 1400

# Lowest acceptable voltage at any energized bus after restoration.
voltage_min_pu: 0.90
# Highest acceptable voltage; only reachable when generation pushes power back up a line.
voltage_max_pu: 1.05

# Distributed generation in kW: a community solar plant on the 19-22 lateral, at unity power
# factor. As interconnection rules require, a unit trips when its bus loses power (it never
# runs an island) and comes back only after the bus has had power again for a while, so it
# cannot help pick up load in the first restoration step.
generation:
  21: 500

# Demos the UI runs in more than one step; `gridmend eval` plans them too so their power flows
# ship with the results. Faults are run together; a staged fault is restored, its generation
# reconnected, and the second stage planned.
warm:
  faults: [["20-21", "27-28"], ["4-5", "16-17"]]
  staged: ["4-5"]
